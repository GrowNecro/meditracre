[platformio]
src_dir = .

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.7
  adafruit/RTClib@^2.1.4
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
build_unflags =
  -std=gnu++11
